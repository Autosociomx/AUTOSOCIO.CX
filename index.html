
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>AutoSocio | ADN Técnico & Sourcing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-cyan: #22d3ee;
        --brand-blue: #2563eb;
        --bg-main: #020617;
      }
      body {
        background-color: var(--bg-main);
        font-family: 'Inter', sans-serif;
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      .font-heading { font-family: 'Space Grotesk', sans-serif; }
      
      /* Neumorfismo Industrial */
      .industrial-card {
        background: linear-gradient(145deg, #0f172a, #020617);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 20px 20px 60px #010409, -5px -5px 20px rgba(255,255,255,0.02);
      }
      
      .glass-bezel {
        background: rgba(30, 41, 59, 0.5);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      }

      @keyframes pulse-soft {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      .glow-soft { animation: pulse-soft 3s ease-in-out infinite; }

      /* Mobile Precision */
      @media (max-width: 640px) {
        .text-hero { font-size: 3rem !important; line-height: 1; }
        .card-grid { grid-template-columns: 1fr !important; gap: 1.5rem !important; }
      }
    </style>
